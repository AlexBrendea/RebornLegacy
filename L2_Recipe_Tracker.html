<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2 Reborn Recipe Tracker</title>
<style>
/* L2 Reborn Recipe Tracker - web edition. Colours mirror the workbook colour keys. */
:root {
  --bg: #12141a; --panel: #1b1f28; --panel2: #232834; --line: #2e3442;
  --text: #e8e4d8; --muted: #9aa1ad; --accent: #d9a441; --accent-ink: #1a1405;
  --link: #8ec1ff; --ok: #6fcf97; --bad: #eb7a6e; --shadow: 0 10px 40px rgba(0,0,0,.45);
  --g-D: #CFE2F3; --g-C: #D9EAD3; --g-B: #F4CCCC; --g-A: #D9D9D9; --g-S: #DAA520; --g-S80: #EBCD84; --g-S84: #F4E4BC;
  --t-raw: #DCE6F1; --t-1: #E8F1E4; --t-2: #FDF3D9; --t-3: #F7DCD4; --t-4: #E3D9F0;
  --t-recipe: #A9D8D3; --t-part: #FCE4D6; --t-crystal: #EDEDED;
  --serif: Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] {
  --bg: #f4f1e8; --panel: #fffdf7; --panel2: #efeadb; --line: #d9d2bd;
  --text: #25221a; --muted: #6b6657; --accent: #9a6b10; --accent-ink: #fff8e6;
  --link: #1b5fb8; --ok: #1f8a4c; --bad: #b3372b; --shadow: 0 10px 40px rgba(60,45,10,.2);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }

/* layout */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px 12px; display: flex; flex-direction: column; }
.brand { font: 700 17px/1.2 var(--serif); letter-spacing: .02em; padding: 0 8px 4px; }
.brand small { display: block; font: 12px var(--sans); color: var(--muted); letter-spacing: 0; margin-top: 3px; font-weight: 400; }
.navgroup { margin: 18px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; margin: 1px 0; border-radius: 6px; color: var(--text); text-decoration: none; border-left: 3px solid transparent; }
.nav a:hover { background: var(--panel2); }
.nav a.on { background: var(--panel2); border-left-color: var(--accent); font-weight: 600; }
.nav a .soon { font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.nav a.later { color: var(--muted); }
.side-foot { margin-top: auto; padding: 14px 8px 0; font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 22px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.burger { display: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.gsearch { position: relative; flex: 1; max-width: 520px; }
.gsearch input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.gsearch input:focus, .controls input:focus, .controls select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; display: none; }
.results.show { display: block; }
.results button { display: flex; width: 100%; gap: 10px; justify-content: space-between; align-items: center; padding: 8px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.results button:hover, .results button.cur { background: var(--panel2); }
.results .kind { font-size: 11px; color: var(--muted); white-space: nowrap; }
.results .none { padding: 12px; color: var(--muted); }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
.iconbtn:hover { background: var(--panel2); }
.content { padding: 22px; max-width: 1500px; width: 100%; }
h1 { font: 700 26px/1.2 var(--serif); margin: 0 0 4px; }
h2 { font: 700 20px/1.25 var(--serif); margin: 0 0 4px; }
h3 { font: 700 15px/1.3 var(--serif); margin: 22px 0 6px; color: var(--accent); letter-spacing: .03em; }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 95ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 12px 0; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0 6px 18px; padding: 0; }
.card li { margin: 3px 0; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

/* chips */
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #1a1a1a; background: #ddd; white-space: nowrap; }
.chip.g-D { background: var(--g-D); } .chip.g-C { background: var(--g-C); } .chip.g-B { background: var(--g-B); }
.chip.g-A { background: var(--g-A); } .chip.g-S { background: var(--g-S); } .chip.g-S80 { background: var(--g-S80); } .chip.g-S84 { background: var(--g-S84); }
.chip.t-raw { background: var(--t-raw); } .chip.t-1 { background: var(--t-1); } .chip.t-2 { background: var(--t-2); }
.chip.t-3 { background: var(--t-3); } .chip.t-4 { background: var(--t-4); } .chip.t-recipe { background: var(--t-recipe); }
.chip.t-part { background: var(--t-part); } .chip.t-crystal { background: var(--t-crystal); }
.chr { display: inline-block; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--panel2); font-weight: 600; }
.sw { display: inline-block; width: 15px; height: 15px; border-radius: 3px; vertical-align: -3px; margin-right: 8px; border: 1px solid rgba(128,128,128,.4); }

/* table controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 12px; }
.controls input[type=search], .controls select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.controls input[type=search] { width: 260px; max-width: 100%; }
.controls label.tog { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }
.controls .count { margin-left: auto; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--link); cursor: pointer; padding: 0; text-decoration: underline; }
.tablewrap { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - 230px); background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
thead th { position: sticky; top: 0; z-index: 3; background: var(--panel2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
thead th button { background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; color: inherit; font-weight: 700; }
thead th button:hover { color: var(--text); }
thead th .arr { color: var(--accent); margin-left: 4px; }
tbody tr:hover td { background: color-mix(in srgb, var(--panel2) 70%, transparent); }
tbody td:first-child { border-left: 4px solid var(--rc, transparent); }
tbody tr.grp:not(:first-child) td { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--muted) 55%, transparent); }
tbody tr.cont td { border-top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { min-width: 220px; max-width: 460px; }
td.note { min-width: 260px; max-width: 520px; color: var(--muted); font-size: 13px; }
.lnk { background: none; border: 0; padding: 0; cursor: pointer; color: var(--link); text-align: left; }
.lnk:hover { text-decoration: underline; }
.lnk.dim { color: var(--muted); }
.ing { white-space: nowrap; }
.ing .q { color: var(--accent); font-variant-numeric: tabular-nums; display: inline-block; min-width: 3.2ch; text-align: right; margin-right: 4px; }
.more { padding: 12px; text-align: center; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* raw breakdown */
.matrix td, .matrix th { padding: 6px 8px; }
.matrix th.col { white-space: normal; min-width: 76px; text-align: center; }
.matrix td.v { text-align: right; font-variant-numeric: tabular-nums; }
.matrix td.v.z { color: color-mix(in srgb, var(--muted) 55%, transparent); }
.matrix td.v.nz { font-weight: 600; background: color-mix(in srgb, var(--accent) 14%, transparent); }
.matrix tbody td:first-child, .matrix thead th:first-child { position: sticky; left: 0; z-index: 2; background: var(--panel); }
.matrix thead th:first-child { z-index: 4; background: var(--panel2); }
.matrix tbody td:first-child, .matrix thead th:first-child { min-width: 190px; white-space: nowrap; border-right: 1px solid var(--line); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 40; }
.scrim.show { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .18s ease; z-index: 50; overflow-y: auto; padding: 18px 20px 40px; }
.drawer.show { transform: none; }
.drawer .x { position: absolute; top: 12px; right: 14px; }
.drawer h2 { padding-right: 70px; }
.drawer .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 4px; color: var(--muted); }
.drawer h4 { margin: 18px 0 6px; font: 700 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.src { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--panel2); }
.src .rate { float: right; font-weight: 700; color: var(--accent); margin-left: 8px; }
.src .note { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills .lnk { padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel2); }
.rowline { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.rowline .q { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.5ch; text-align: right; }
.rowline .k { margin-left: auto; }

/* notes */
.notes h3 { margin-top: 26px; }
.pre { white-space: pre-wrap; font: 13px/1.5 var(--mono); max-width: 118ch; color: var(--text); }

.banner { border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 10px; padding: 12px 16px; margin: 12px 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 45; left: 0; top: 0; width: 280px; transform: translateX(-100%); transition: transform .18s ease; box-shadow: var(--shadow); }
  .side.open { transform: none; }
  .burger { display: inline-block; }
  .content { padding: 14px; }
  .top { padding: 8px 12px; }
  .tablewrap { max-height: none; }
  .controls .count { margin-left: 0; width: 100%; }
  .hm { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Sections">
    <div class="brand">Reborn: Legacy<small>Equipment Recipe Tracker</small></div>
    <div id="nav"></div>
    <div class="side-foot" id="foot"></div>
  </nav>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu">☰</button>
      <div class="gsearch">
        <input id="gs" type="search" placeholder="Jump to any item, material or recipe… (press /)" autocomplete="off" aria-label="Search everything">
        <div class="results" id="gres" role="listbox"></div>
      </div>
      <button class="iconbtn" id="theme" title="Switch light / dark theme">Theme</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details" aria-hidden="true"></aside>

mith's Holder,","b":false},{"t":"and Arcsmith's Anvil, C4 for Durable Metal Plate.","b":false},{"t":"Equipment recipes (armor, weapons, jewelry) will be added in a later pass.","b":false},{"t":"","b":false},{"t":"IMPORTANT — chronicle-specific notes","b":false},{"t":"  - Metal Hardener is NEW as of C2 — confirmed 404 on l2hub.info's C1 database, present from C2 onward","b":false},{"t":"    (10 Stem + 10 Varnish + 10 Iron Ore, skill lvl 4, 100% success).","b":false},{"t":"  - Metallic Thread is NEW as of C3 — confirmed 404 on l2hub.info's C1/C2 database, present from C3 onward","b":false},{"t":"    (10 Thread + 5 Iron Ore, skill lvl 4, 100% success, drop-only recipe scroll).","b":false},{"t":"  - Reinforced Metal Plate (C3) and Durable Metal Plate (C4) are the SAME underlying item (Item ID 5550, 5","b":false},{"t":"    Metallic Thread + 5 Mithril Ore, skill lvl 4, 100%, MP 40) — l2hub.info simply renames it starting C4.","b":false},{"t":"    Both are kept as separate rows in this workbook on purpose: the C3 name is still accurate and needed for","b":false},{"t":"    that stage of the server's progression (e.g. as an ingredient in Leolin's Mold, which calls for it by its","b":false},{"t":"    C3 name), and only becomes obsolete once the server reaches C4, at which point Durable Metal Plate takes","b":false},{"t":"    over under the new name with an identical recipe.","b":false},{"t":"  - Warsmith's Mold, Warsmith's Holder, Arcsmith's Anvil, and Leolin's Mold are all NEW as of C3, and are all","b":false},{"t":"    NPC Blacksmith crafts, NOT farmable recipe scrolls — crafted directly in town using the listed ingredients","b":false},{"t":"    plus an Adena fee. l2hub.info shows no working 'Craft' tab (Drop/Spoil) for any of the four — only an 'In","b":false},{"t":"    Recipe' listing and, in some cases, an empty 'Exchange From'/'Exchange For' table. (Leolin's Mold does show","b":false},{"t":"    a nominal 'Recipe' page with an ingredient list, which is where 40 Cord + 10 Reinforced Metal Plate + 15","b":false},{"t":"    Adamantite Nugget, skill lvl 5, 100%, MP 50 came from — but per user correction it's an NPC craft like the","b":false},{"t":"    other three, not something obtainable through ordinary farming.) Since l2hub.info doesn't expose usable","b":false},{"t":"    ingredient/exchange data for these items, ingredients were cross-verified via l2int.ru, wiki.la2era.com,","b":false},{"t":"    and l2elo.com instead (l2j.ru, the other source suggested for this data, blocks automated access, so it","b":false},{"t":"    could not be checked directly — but the sources used agree exactly with each other and with","b":false},{"t":"    l2-servera.com's numbers). See the Material Recipe Sourcing tab for a 'no scroll needed' note on all four.","b":false},{"t":"  - CORRECTION: the entire 'Frame'/'Mold'/'Holder' crafting-tool chain checked so far — Steel Mold, Silver","b":false},{"t":"    Mold, Artisan's Frame, Blacksmith's Frame, Maestro Anvil Lock, Maestro Holder, Maestro Mold, and Craftsman","b":false},{"t":"    Mold — turned out to be C1-native, not gated to C2/C3 as first assumed. Recipes: Steel Mold (5 Braided","b":false},{"t":"    Hemp + 5 Iron Ore + 5 Coal), Silver Mold (5 Braided Hemp + 5 Cokes + 10 Silver Nugget), Artisan's Frame (1","b":false},{"t":"    Steel Mold + 5 Varnish of Purity + 10 Adamantite Nugget), Blacksmith's Frame (1 Silver Mold + 5 Varnish of","b":false},{"t":"    Purity + 10 Mithril Ore), Maestro Anvil Lock (4 Synthetic Cokes + 4 Mold Glue + 4 Mold Lubricant), Maestro","b":false},{"t":"    Holder (10 Varnish of Purity + 10 Mold Lubricant + 10 Mold Hardener), Maestro Mold (1 Blacksmith's Frame +","b":false},{"t":"    10 Mold Glue + 5 Asofe), Craftsman Mold (2 Artisan's Frame + 20 Mold Hardener + 5 Enria). Skill lvl 2","b":false},{"t":"    (molds) / lvl 4 (frames) / lvl 6 (anvil lock, holder, maestro mold, craftsman mold), all 100% success.","b":false},{"t":"  - Per user research, C4 introduces no other new craftable materials beyond the Durable Metal Plate rename —","b":false},{"t":"    this matches everything independently verified here. This closes out the 'Frame'/'Mold'/'Holder' family","b":false},{"t":"    tracked since C2: every piece of it (Steel Mold, Silver Mold, Artisan's Frame, Blacksmith's Frame, Maestro","b":false},{"t":"    Anvil Lock, Maestro Holder, Maestro Mold, Craftsman Mold, Warsmith's Mold, Warsmith's Holder, Arcsmith's","b":false},{"t":"    Anvil, Leolin's Mold) has now been individually verified rather than assumed from community lists.","b":false},{"t":"  - ORICHALCUM (Raw Material Breakdown tab only, not used in any recipe here): a raw material introduced from the","b":false},{"t":"    Kamael chronicle onward — well past the current scope of this workbook. Added as a column for future","b":false},{"t":"    reference per user request; it will read 0 for every material until a Kamael-era+ recipe using it is","b":false},{"t":"    added to the Material Recipes tab. See the comment on its column header in Raw Material Breakdown for the same note.","b":false},{"t":"  - All 19 materials that existed pre-C3 were spot-checked against l2hub.info's C3 and C4 databases (including","b":false},{"t":"    the most deeply-nested ones, Coarse Bone Powder and Mithril Alloy): ingredient lists, quantities, skill","b":false},{"t":"    levels, and success rates are IDENTICAL across every chronicle checked so far — C1 through C4.","b":false},{"t":"  - These corrections override any earlier chronicle-agnostic community lists (e.g. l2-servera.com) that","b":false},{"t":"    presented the full Dwarven material tree as if every material existed from C1.","b":false},{"t":"  - PHASE 1 COMPLETE as of C4. Per user research, C5, Interlude, and Gracia Final introduce no further","b":false},{"t":"    craftable Dwarven materials, so the Material Recipes/Raw Material Breakdown/Material Recipe Sourcing tabs are considered done for","b":false},{"t":"    this material tier (equipment recipes — weapons, armor, jewelry — are a separate, later pass).","b":false},{"t":"","b":false},{"t":"PLANNED PHASES","b":true},{"t":"  Phase 1 — Recipe database (COMPLETE): materials, tiers, ingredients, sub-material breakdown, sourcing.","b":false},{"t":"  Phase 2 — Warehouse/inventory tracker (COMPLETE): what you currently hold. Recipe scrolls, key","b":false},{"t":"            materials, and crystals/gemstones are tracked here too as equipment gets added.","b":false},{"t":"  Phase 2.5 — First equipment item added (COMPLETE): Tarbar (D-grade Blunt/One-Handed) — the item that","b":false},{"t":"              kicked off equipment tracking and led into Phase 3.","b":false},{"t":"  Phase 3 — Requirements Check tab (COMPLETE): dropdown-driven shortfall/surplus vs. Warehouse, plus a","b":false},{"t":"            raw-material shopping list for any shortfall in a craftable ingredient. Fully working.","b":false},{"t":"  Phase 4 — Addition of ALL craftable equipment (in progress, current phase): every craftable D/C/B/A/S-grade","b":false},{"t":"            weapon, armor, and jewelry item the user wants tracked, across every chronicle up to the","b":false},{"t":"            server's launch (November). This supersedes the original 'Scenario outputs' description.","b":false},{"t":"","b":false},{"t":"CHRONICLE-TRANSITION SOURCING CHECK POLICY (established when moving C2 -> C3, applies to all future moves)","b":false},{"t":"  When the server's chronicle advances, EVERY previously-added item (grouped by grade, oldest grade first —","b":false},{"t":"  D, then C, then B, etc.) gets its drop/spoil sourcing re-checked against the new chronicle on l2hub.info.","b":false},{"t":"  Standard depth for this ongoing check ('Option B'): verify whether the currently-documented BEST source","b":false},{"t":"  still exists and at what rate; don't re-pull the full drop/spoil list for every item unless the current","b":false},{"t":"  source looks to have disappeared or unusually weak. A full exhaustive re-check of every source for every","b":false},{"t":"  item is deferred until the whole D-S equipment build is complete, as one comprehensive pass before the","b":false},{"t":"  server's November launch — not repeated at every incremental chronicle bump.","b":false},{"t":"  Row format ('Option A', locked in during the C3 pass): every item that gets checked receives a NEW","b":false},{"t":"  sourcing row tagged with the new chronicle, whether or not anything actually changed — e.g. a same-source/","b":false},{"t":"  same-rate confirmation still gets its own C3 row noting 'C3 CHECK (done): confirmed unchanged'. The old","b":false},{"t":"  chronicle's row is NEVER removed or edited — this preserves history and lets the workbook show exactly","b":false},{"t":"  which chronicle each sourcing option is valid for. If a source is found to have disappeared, the old row","b":false},{"t":"  stays (for historical reference) and a new row for the replacement source is added.","b":false},{"t":"  Raid boss preference (established starting the C-grade C3 pass, applies going forward — not retroactively","b":false},{"t":"  applied to D-grade): if the best available source for an item is a raid boss, keep looking for the next-","b":false},{"t":"  best REGULAR (non-raid-boss) NPC source and use that instead. Only document a raid boss as the source if","b":false},{"t":"  it is genuinely the ONLY option available — raid bosses are unreliable to farm on demand, so a lower-rate","b":false},{"t":"  regular mob is more useful in practice than a higher-rate raid boss drop.","b":false},{"t":"","b":false},{"t":"SOURCE CONFIDENCE","b":true},{"t":"  Everything in this workbook — ingredient quantities, chronicle availability, AND recipe scroll sourcing —","b":false},{"t":"  is sourced directly from l2hub.info's chronicle-specific database (C1 through C4 checked so far).","b":false},{"t":"","b":false},{"t":"KNOWN GAP — RECIPE QUANTITY RE-VERIFICATION (IMPORTANT)","b":true},{"t":"  The chronicle-transition C3 check (D-grade, C-grade, and the first B-grade set: Doom Plate Armor)","b":false},{"t":"  focused ONLY on re-verifying WHERE to source each recipe scroll and key material (drop/spoil rates,","b":false},{"t":"  NPC, chronicle). It did NOT systematically re-check whether the recipe's own ingredient LIST and","b":false},{"t":"  QUANTITIES stayed the same across chronicles — that was only spot-checked incidentally a handful of","b":false},{"t":"  times (e.g. when a recipe scroll's craft page had to be opened anyway to find its 100%/60% slug), and","b":false},{"t":"  those spot checks all matched. Starting with the B-grade Avadon set onward, recipe quantities are being","b":false},{"t":"  actively re-verified alongside sourcing as part of each item's C3 check. If you want full confidence on","b":false},{"t":"  D-grade and C-grade recipe quantities specifically, that pass still needs to be done retroactively.","b":false},{"t":"","b":false},{"t":"S80 TIER (Dynasty K, Icarus HB) - added in v157","b":false},{"t":"S80 items have their own Grade value ('S80') on Equipment Recipes and their own entry in the Requirements Check grade dropdown (named range Items_S80, REF column AH); they are NOT part of the normal S list.","b":false},{"t":"Dynasty (K): 28 items (9 weapons, 16 armor/shield, 3 jewelry). Icarus (HB): 9 weapons. Names follow the Hellbound wiki (e.g. 'Dynasty Breast Plate', 'Dynasty Gaiters').","b":false},{"t":"Wiki quantities: 18 pieces per recipe (older S rows use 17). Icarus quantities are the Hellbound ones; they were rebalanced in High Five.","b":false},{"t":"New raw materials Adamantine (weapons) and Leonard (jewelry) are plain Warehouse raw rows; no craft recipe found.","b":false},{"t":"Sources: Dynasty = exchange (Hidden Pages + Demon Contract Fragment, or Seed of Evil shards). Icarus = Kirklan exchange (Freed Soul + Dragonkin Charm), documented from Gracia Final on the wiki, nothing listed in Hellbound. Source Type 'Exchange' is new.","b":false},{"t":"Freya-era drops are not tracked.","b":false},{"t":"","b":false},{"t":"MOIRAI (S80, Freya) - added in v158","b":false},{"t":"20 items: 17 armor/sigil/shield + 3 jewelry (no weapons exist). Recipes and pieces come only from regular-monster spoil/drop in Freya; no exchange. Chronicle label 'F' = Freya.","b":false},{"t":"Uses only materials already in the workbook (Leonard for jewelry). 18 pieces per recipe, skill level 9, MP 246. Sources: top two non-raid options per row, by rate.","b":false},{"t":"","b":false},{"t":"VESPER (S84, Gracia) - added in v159","b":false},{"t":"31 items: 11 weapons, 17 armor/sigil/shield, 3 jewelry. Own grade 'S84' on Equipment Recipes, own Requirements Check dropdown option (named range Items_S84, REF column AI).","b":false},{"t":"Chronicle label GF per the Vesper = Gracia rule. The wiki only has Vesper recipes and sources in the Freya database, so rates are Freya-era; all sources are regular monsters (spoil), no raids. Weapons also have a Kirklan-type exchange (Freed Soul + Spirit Stone Fragment + Dragonkin Charm).","b":false},{"t":"19 pieces per recipe, skill level 9, MP 252. The wiki names the shield piece 'Sealed Vesper Verteidiger Piece'; recorded here as 'Sealed Vesper Shield Piece'.","b":false},{"t":"","b":false},{"t":"OPEN DATA ISSUES (documented in v160)","b":false},{"t":"1. RECIPE QUANTITIES ARE THE C4 LISTS. Verified example: S-grade Draconic Bow changed at C5 and stays the same through High Five: C4 = 212 Crystal, 75 Synthetic Cokes, 375 Mithril Alloy, 75 Enria, 150 Durable Metal Plate; C5+ = 214 Crystal, 77 High Grade Suede, 77 Compound Braid, 385 Mithril Alloy, 77 Enria, 154 Durable Metal Plate. The piece count (17) did not change. Older D-S equipment has NOT been re-audited for ingredient quantities after C4 (see KNOWN GAP above). Dynasty (K), Icarus (HB), Moirai (F) and Vesper (GF) use the numbers of their own database.","b":false},{"t":"2. PIECE COUNTS: older S-grade recipes need 17 pieces, Dynasty/Icarus/Moirai 18, Vesper 19. This matches the wiki and is not an error.","b":false},{"t":"3. GF BOSS STATUS UNVERIFIED: three Gracia Final sourcing rows (Karpencharr - Prophet of Lies, Romerohiv - Betrayer of Oblivion, Freedkyilla - Hand of Night; NPC ids 25637, 25638, 25640). The wiki does not flag them as raids but they are single-spawn Seed of Annihilation monsters, so they are probably raid-type. Under the non-raid preference they should be replaced by the best regular-monster source if one exists. Filter the Audit Log tab for 'UNVERIFIED'.","b":false},{"t":"4. SOURCE LABELS: Icarus is labelled HB (introduced in Hellbound) but the wiki lists its only source (Kirklan exchange) from Gracia Final. Vesper is labelled GF but the wiki only has its recipes and sources in the Freya database. Moirai is labelled F (Freya). Freya-era drops for Dynasty/Icarus are not tracked.","b":false},{"t":"5. NAMING: equipment names drop the 'Sealed' prefix (e.g. Dynasty Breast Plate), recipe rows for sealed armor/jewelry keep it (Recipe: Sealed ...), part names keep the wiki name. The Kamael wiki page spells it 'Blast Plate' and one Vesper shield piece 'Verteidiger'; the Hellbound/Freya spellings were used.","b":false},{"t":"6. FIXED IN v160: Warehouse was missing 'Recipe: Kris (60%)' (only the 100% recipe was listed). Added next to the 100% one.","b":false},{"t":"7. Check notes of the form '<chronicle> CHECK (done): ...' were moved to the Audit Log tab (full original text); the Equipment Sourcing Notes column (hidden) keeps the text without that tag.","b":false},{"t":"","b":false},{"t":"FILE HISTORY / HOW THIS FILE IS BUILT","b":false},{"t":"v155: audits finished (C3..GF). v156-v159: S80 Dynasty, Icarus, Moirai and S84 Vesper added. v160: formatting pass (filters, Grade/Type columns, borders, Start Here rewrite, Audit Log). v161: small adjustments (see end of Notes). v162: Material Recipe Sourcing Notes column hidden + outer border.","b":false},{"t":"Filters rely on item names being repeated on every row of a block (merged cells would break filtering). The repeats are intentionally invisible (font colour = fill colour). Do not sort the recipe tabs; filtering is safe.","b":false},{"t":"Requirements Check is protected without a password so only B2:B4 are editable (Review > Unprotect Sheet to change it). The ingredient-count helper lives in the hidden CALC tab.","b":false},{"t":"","b":false},{"t":"MOVED FROM START HERE (previous version of the page)","b":false},{"t":"GENERAL RULES FOR ADDING NEW EQUIPMENT (established this pass — keep applying going forward)","b":false},{"t":"  1. Equipment 'key materials' (e.g. Tarbar Head) are purely farmed — don't look for a crafting recipe for","b":false},{"t":"     them; l2hub.info won't have a 'Craft' tab for these, only Drop/Spoil.","b":false},{"t":"  2. Every equipment item needs a matching 'Recipe: <item>' row on the Warehouse tab, not just its","b":false},{"t":"     ingredients. At D/C-grade the recipe is reusable (learn once, craft unlimited copies) — at B-grade+","b":false},{"t":"     recipes are typically consumed per craft, so watch for that distinction when adding higher-grade gear.","b":false},{"t":"     Warehouse category order is: Raw Material → Tier 1-4 → Recipe → Equipment Part → Crystal/Gemstone.","b":false},{"t":"  3. Color-code every item by grade, consistently, on the Equipment Recipes and Equipment Sourcing tabs:","b":false},{"t":"     D = blue, C = green, B = red, A = gray, S = dark yellow/gold.","b":false},{"t":"SHEETS IN THIS FILE (tab order: Start Here, then Warehouse + Requirements Check — the two you'll actually","b":false},{"t":"use day to day — then the reference/database tabs, then Notes at the end)","b":false},{"t":"  Warehouse          — Phase 2. Every raw material, craftable material, equipment recipe, equipment 'key","b":false},{"t":"                       material', and crystal/gemstone currently tracked, in that order, each with an","b":false},{"t":"                       editable blue 'Quantity on Hand' cell. Purely a data-entry sheet — no formulas yet.","b":false},{"t":"  Requirements Check — Phase 3. Pick a grade (cell B2) then an item from that grade only (cell B3, filtered","b":false},{"t":"                       via the grade selection — keeps the item list manageable as more B/A/S-grade gear gets","b":false},{"t":"                       added), and how many to craft (B4).","b":false},{"t":"                       'To Craft (Gross Shortfall)' = Total Needed - Warehouse Qty per ingredient, regardless","b":false},{"t":"                       of whether raw materials are currently on hand for it. 'Craftable From Stock' caps","b":false},{"t":"                       that at what your CURRENT raw materials could actually cover; 'Effective Available' =","b":false},{"t":"                       Warehouse Qty + Craftable From Stock, and Balance/Status are based on that (green =","b":false},{"t":"                       OK, red = SHORT — no button needed, recalculates live). E.g. short 8 Steel, holding 40","b":false},{"t":"                       Iron Ore + 40 Varnish → Balance = 0. The second raw-materials table below always uses","b":false},{"t":"                       'To Craft (Gross Shortfall)', NOT the stock-limited amount, so partial coverage nets","b":false},{"t":"                       correctly: short 8 Steel with 40 Varnish but only 34 Iron Ore still shows 'Still","b":false},{"t":"                       Needed' = 6 for Iron Ore (40 gross - 34 on hand), not 0, even though Craftable From","b":false},{"t":"                       Stock caps the Steel-level shortfall at 6. Known limitation: if two shortfall","b":false},{"t":"                       ingredients in the same recipe both draw on the same raw material, the tool checks","b":false},{"t":"                       each independently rather than splitting that material between them — double-check by","b":false},{"t":"                       hand in that (uncommon) case. When everything reads OK, manually copy the Balance","b":false},{"t":"                       values over to Warehouse after crafting — a true one-click 'Commit' would need a","b":false},{"t":"                       macro-enabled workbook (.xlsm + VBA), which trades reliability for convenience, so","b":false},{"t":"                       this stays a plain formula-driven .xlsx instead. There are two hidden helper sheets","b":false},{"t":"                       behind this one — 'REF' (per-item ingredient lookup, grade-grouped item lists +","b":false},{"t":"                       'Items_D'/'Items_C'/'Items_B'/'Items_A'/'Items_S'/'Items_S80'/'Items_S84' named ranges the grade filter uses)","b":false},{"t":"                       and 'CALC' (craftable-from-stock matrix) — don't delete either, and don't delete or","b":false},{"t":"                       rename those named ranges.","b":false},{"t":"  Material Recipes   — one row per ingredient, grouped under each material (merged cell): tier, chronicle","b":false},{"t":"                       introduced, output qty, ingredient, quantity, and an editable 'Owned?' toggle (one","b":false},{"t":"                       per material, defaults to No) for recipe scrolls you've actually learned. Sorted","b":false},{"t":"                       strictly by Tier (1 → 4) so materials of the same complexity level stay grouped.","b":false},{"t":"  Raw Material Breakdown — each material flattened all the way down to raw (non-craftable) materials, per","b":false},{"t":"                       1 unit produced. Formulas pull from the Material Recipes sheet, so editing a recipe","b":false},{"t":"                       there recalculates this sheet automatically.","b":false},{"t":"  Material Recipe Sourcing — where to obtain each MATERIAL RECIPE SCROLL itself (not the ingredients) — up","b":false},{"t":"                       to 2 best sources per material (by spoil/drop %), pulled from l2hub.info's chronicle-","b":false},{"t":"                       specific drop/spoil tables. The 100% success rate for crafting is separate and isn't","b":false},{"t":"                       shown here — 'Rate' is the monster's chance to drop/spoil the scroll.","b":false},{"t":"  Equipment Recipes  — Phase 2.5. Same layout idea as the Material Recipes tab, but for finished weapons/","b":false},{"t":"                       armor/jewelry: one row per ingredient, grouped under each item (merged cell), with","b":false},{"t":"                       Type, Grade, skill level, success rate, MP cost, and the same 'Owned?' toggle as","b":false},{"t":"                       Material Recipes. Colored by grade, not tier — see Color Key below.","b":false},{"t":"  Equipment Sourcing — Phase 2.5. Same layout as Material Recipe Sourcing, but for equipment: where to get","b":false},{"t":"                       the RECIPE SCROLL for each item, plus any item-specific 'key material' (e.g. Tarbar","b":false},{"t":"                       Head) that isn't already covered elsewhere. Ordinary shared materials (Steel, Cokes,","b":false},{"t":"                       etc.) stay on the Material Recipe Sourcing tab and aren't repeated here.","b":false},{"t":"  Notes              — background/methodology: scope, chronicle-by-chronicle findings and corrections,","b":false},{"t":"                       planned phases, and source confidence. Not needed day to day — reference only.","b":false},{"t":"COLOR KEY — Materials (Material Recipes / Raw Material Breakdown / Material Recipe Sourcing / Warehouse tiers)","b":false},{"t":"  Raw material (dropped/spoiled/farmed only — never crafted)","b":false},{"t":"  Tier 1 material (built directly from raw/dropped materials)","b":false},{"t":"  Tier 2 material (built from Tier 1 materials + raw materials)","b":false},{"t":"  Tier 3 material (built from Tier 1/2 materials + raw materials)","b":false},{"t":"  Tier 4 material (built from Tier 3 materials + raw materials — e.g. Maestro Mold from Blacksmith's Frame)","b":false},{"t":"  Recipe (equipment recipe scroll entry on Warehouse tab)","b":false},{"t":"  Equipment part / key material (weapon/armor-specific, farmed only — e.g. Tarbar Head)","b":false},{"t":"  Crystal / Gemstone (common D-grade+ crafting currency, dropped by a wide range of monsters)","b":false},{"t":"COLOR KEY — Equipment grade (Equipment Recipes / Equipment Sourcing tabs)","b":false},{"t":"  D-grade = blue","b":false},{"t":"  C-grade = green","b":false},{"t":"  B-grade = red","b":false},{"t":"  A-grade = gray","b":false},{"t":"  S-grade = dark yellow / gold","b":false},{"t":"  S80-grade (Dynasty, Icarus, Moirai) = pale gold. Only the recipe rows on Equipment Recipes/Sourcing; parts keep the orange part colour","b":false},{"t":"  S84-grade (Vesper) = even paler gold. Only the recipe rows; parts keep the orange part colour","b":false},{"t":"","b":false},{"t":"REQUIREMENTS CHECK - HOW THE CALCULATION WORKS (moved here from the tab description in v161)","b":true},{"t":"Pick an item and how many you want to craft. 'To Craft (Gross Shortfall)' is simply Total Needed","b":false},{"t":"minus Warehouse Qty for each ingredient — how many you'd need to make from scratch, regardless of","b":false},{"t":"whether you currently have the raw materials for it. 'Craftable From Stock' shows how many of THOSE","b":false},{"t":"you could actually make right now given what's in the Warehouse (e.g. short 8 Steel, holding 40 Iron","b":false},{"t":"Ore + 40 Varnish → Craftable From Stock = 8, since that's exactly enough). 'Effective Available' =","b":false},{"t":"Warehouse Qty + Craftable From Stock, and Balance/Status are based on THAT — so Balance correctly","b":false},{"t":"reads 0 in that example. No button needed, it all recalculates live. The second table below always","b":false},{"t":"uses 'To Craft (Gross Shortfall)' — NOT the stock-limited amount — to work out the raw materials","b":false},{"t":"needed, then nets that against Warehouse stock. This matters when your raw materials only PARTIALLY","b":false},{"t":"cover a shortfall: e.g. short 8 Steel, with 40 Varnish but only 34 Iron Ore — Craftable From Stock","b":false},{"t":"is capped at 6 (the Iron Ore bottleneck), but the raw-material table still correctly asks for the","b":false},{"t":"full 40 Iron Ore gross, nets against your 34, and shows 'Still Needed' = 6, not 0. Note: this checks","b":false},{"t":"one ingredient's raw-material needs at a time — if two shortfall ingredients in the same recipe draw","b":false},{"t":"on the same raw material, the tool doesn't split that material between them, so double-check by hand","b":false},{"t":"in that (uncommon) case. Shortfalls in non-craftable ingredients (raw materials, equipment parts,","b":false},{"t":"crystals/gemstones) just need to be farmed directly.","b":false},{"t":"v161: small adjustments - chronicle names on Start Here, Warehouse row heights, shorter Requirements Check description, Adamantine and Leonard added to Raw Material Breakdown / Requirements Check, Material Recipe Sourcing header height, 'C1' cell format on Equipment Recipes/Material Recipes.","b":false}],"catalogue":[["Raw Material","Animal Bone","—","—"],["Raw Material","Animal Skin","—","—"],["Raw Material","Stem","—","—"],["Raw Material","Iron Ore","—","—"],["Raw Material","Varnish","—","—"],["Raw Material","Coal","—","—"],["Raw Material","Charcoal","—","—"],["Raw Material","Thread","—","—"],["Raw Material","Stone of Purity","—","—"],["Raw Material","Silver Nugget","—","—"],["Raw Material","Mithril Ore","—","—"],["Raw Material","Oriharukon Ore","—","—"],["Raw Material","Suede","—","—"],["Raw Material","Adamantite Nugget","—","—"],["Raw Material","Mold Glue","—","—"],["Raw Material","Mold Lubricant","—","—"],["Raw Material","Mold Hardener","—","—"],["Raw Material","Asofe","—","—"],["Raw Material","Enria","—","—"],["Raw Material","Thons","—","—"],["Raw Material","Orichalcum","—","—"],["Raw Material","Adamantine","—","—"],["Raw Material","Leonard","—","—"],["Tier 1","Coarse Bone Powder","—","C1"],["Tier 1" rystal: S Grade","—","C4"],["Crystal / Gemstone","Gemstone S","—","C4"]]};
</script>
<script>
/* L2 Reborn Recipe Tracker - web edition (reference tabs). Data comes from data.js (exported from the workbook). */
(function () {
'use strict';
const D = window.L2_DATA;
const GRADES = ['D', 'C', 'B', 'A', 'S', 'S80', 'S84'];
const CHRON = ['C1', 'C2', 'C3', 'C4', 'C5', 'IL', 'K', 'HB', 'GF', 'F'];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lc = s => String(s == null ? '' : s).toLowerCase();
const num = n => (typeof n === 'number' ? n.toLocaleString('en-US', { maximumFractionDigits: 3 }) : esc(n));
const pct = v => (typeof v === 'number' ? Math.round(v * 1000) / 10 + '%' : esc(v));
function rate(v) {
  if (typeof v !== 'number') return esc(v == null ? '' : v);
  let s = (v * 100).toFixed(4).replace(/0+$/, '');
  if (s.endsWith('.')) s += '0';
  return s + '%';
}
const rateSort = v => (typeof v === 'number' ? v : -1);
const uniq = a => [...new Set(a)];
const byOrder = order => (a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b));

/* ------------------------------------------------------------------ indexes */
const matByName = {}; D.materials.forEach(m => (matByName[m.name] = m));
const itemByName = {}; D.equipment.forEach(i => (itemByName[i.name] = i));
const rawCols = D.rawBreakdown.cols;
const rawByMat = {}; D.rawBreakdown.rows.forEach(([n, v]) => (rawByMat[n] = v));
const catByName = {}; D.catalogue.forEach(([cat, n, g, intro]) => (catByName[n] = { cat, g, intro }));
const esByKey = {}; D.equipSourcing.rows.forEach(r => (esByKey[r[0]] = esByKey[r[0]] || []).push(r));
const msByKey = {}; D.matSourcing.rows.forEach(r => (msByKey[r[0]] = msByKey[r[0]] || []).push(r));
const usedInItems = {}; D.equipment.forEach(it => it.ing.forEach(([n]) => (usedInItems[n] = usedInItems[n] || []).push(it)));
const usedInMats = {}; D.materials.forEach(m => m.ing.forEach(([n]) => (usedInMats[n] = usedInMats[n] || []).push(m)));
const recipeOf = {}; D.equipment.forEach(it => it.rk && (recipeOf[it.rk] = it)); D.materials.forEach(m => (recipeOf['Recipe: ' + m.name] = m));

function kindOf(name) {
  if (itemByName[name]) return { label: 'Equipment · ' + itemByName[name].grade, cls: 'g-' + itemByName[name].grade };
  if (matByName[name]) return { label: 'Material · Tier ' + matByName[name].tier, cls: 't-' + matByName[name].tier };
  if (rawCols.includes(name)) return { label: 'Raw material', cls: 't-raw' };
  const c = catByName[name];
  if (c) {
    if (c.cat.startsWith('Crystal')) return { label: 'Crystal / Gemstone', cls: 't-crystal' };
    if (c.cat === 'Equipment Part') return { label: 'Equipment part', cls: 't-part' };
    if (c.cat === 'Recipe') return { label: 'Recipe scroll', cls: 't-recipe' };
  }
  if (/^Recipe: /.test(name)) return { label: 'Recipe scroll', cls: 't-recipe' };
  if (esByKey[name]) return { label: 'Equipment part', cls: 't-part' };
  if (/^(Crystal:|Gemstone)/.test(name)) return { label: 'Crystal / Gemstone', cls: 't-crystal' };
  return { label: 'Item', cls: '' };
}
const gradeColor = g => `var(--g-${g})`;
const tierColor = t => `var(--t-${t})`;
const chip = (text, cls) => `<span class="chip ${cls || ''}">${esc(text)}</span>`;
const link = (name, extra) => `<button class="lnk ${extra || ''}" data-open="${esc(name)}">${esc(name)}</button>`;
const isCurrency = n => /^(Crystal:|Gemstone)/.test(n);
const ingList = ing => ing.map(([n, q]) => `<div class="ing"><span class="q">${num(q)}×</span>${link(n, isCurrency(n) ? 'dim' : '')}</div>`).join('');

/* --------------------------------------------------------------- table engine */
function makeTable(host, cfg, st) {
  st.q = st.q || ''; st.f = st.f || {}; st.sort = st.sort || null; st.t = st.t || {};
  cfg.toggles && cfg.toggles.forEach(t => { if (!(t.id in st.t)) st.t[t.id] = !!t.def; });
  st.limit = st.limit || cfg.pageSize || 150;
  const hay = cfg.rows.map(r => lc(cfg.search(r)));
  const visibleCols = () => cfg.cols.filter(c => !c.toggle || st.t[c.toggle]);
  host.innerHTML = `
    <div class="controls">
      <input type="search" placeholder="${esc(cfg.placeholder || 'Search…')}" aria-label="Search this table" value="${esc(st.q)}">
      ${(cfg.filters || []).map(f => `<select data-f="${f.id}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: all</option>${f.options.map(o => `<option value="${esc(o)}"${st.f[f.id] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('')}
      ${(cfg.toggles || []).map(t => `<label class="tog"><input type="checkbox" data-t="${t.id}"${st.t[t.id] ? ' checked' : ''}> ${esc(t.label)}</label>`).join('')}
      <button class="linkbtn" data-reset hidden>Clear filters</button>
      <span class="count"></span>
    </div>
    <div class="tablewrap"><table><thead></thead><tbody></tbody></table><div class="more"></div></div>`;
  const thead = $('thead', host), tbody = $('tbody', host), more = $('.more', host), count = $('.count', host), reset = $('[data-reset]', host);

  function filtered() {
    const terms = lc(st.q).split(/\s+/).filter(Boolean);
    let idx = [];
    for (let i = 0; i < cfg.rows.length; i++) {
      const r = cfg.rows[i];
      let ok = true;
      for (const f of cfg.filters || []) { const v = st.f[f.id]; if (v && !f.test(r, v)) { ok = false; break; } }
      if (ok) for (const t of terms) if (!hay[i].includes(t)) { ok = false; break; }
      if (ok) idx.push(i);
    }
    if (st.sort) {
      const c = cfg.cols.find(x => x.key === st.sort.key), dir = st.sort.dir;
      const key = c.sort || c.get;
      idx.sort((a, b) => {
        let x = key(cfg.rows[a]), y = key(cfg.rows[b]);
        if (x == null) x = ''; if (y == null) y = '';
        const d = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });
        return (d || a - b) * dir;
      });
    }
    return idx.map(i => cfg.rows[i]);
  }
  function drawHead() {
    thead.innerHTML = '<tr>' + visibleCols().map(c => {
      const on = st.sort && st.sort.key === c.key;
      return `<th class="${c.cls || ''}">${c.nosort ? esc(c.label) : `<button data-sort="${c.key}" aria-label="Sort by ${esc(c.label)}">${esc(c.label)}${on ? `<span class="arr">${st.sort.dir > 0 ? '▲' : '▼'}</span>` : ''}</button>`}</th>`;
    }).join('') + '</tr>';
  }
  function draw() {
    const rows = filtered(), cols = visibleCols();
    const shown = rows.slice(0, st.limit);
    let prevKey = null;
    tbody.innerHTML = shown.map(r => {
      const rc = cfg.stripe ? cfg.stripe(r) : '';
      const key = cfg.group ? cfg.group(r) : null;
      const cont = key !== null && key === prevKey;
      prevKey = key;
      return `<tr class="${cont ? 'cont' : cfg.group ? 'grp' : ''}">${cols.map((c, i) => `<td class="${c.cls || ''}"${i === 0 && rc ? ` style="--rc:${rc}"` : ''}>${cont && (cfg.groupCols || []).includes(c.key) ? '' : c.html(r)}</td>`).join('')}</tr>`;
    }).join('') || `<tr><td class="empty" colspan="${cols.length}">Nothing matches these filters.</td></tr>`;
    const left = rows.length - shown.length;
    more.innerHTML = left > 0 ? `Showing ${shown.length} of ${rows.length} · <button class="linkbtn" data-more>show ${Math.min(left, cfg.pageSize || 150)} more</button> · <button class="linkbtn" data-all>show all</button>` : '';
    count.textContent = `${rows.length} of ${cfg.rows.length} ${cfg.noun || 'rows'}`;
    const active = st.q || Object.values(st.f).some(Boolean);
    reset.hidden = !active;
  }
  drawHead(); draw();
  host.addEventListener('input', e => {
    if (e.target.matches('input[type=search]')) { st.q = e.target.value; st.limit = cfg.pageSize || 150; draw(); }
  });
  host.addEventListener('change', e => {
    const f = e.target.dataset.f, t = e.target.dataset.t;
    if (f) { st.f[f] = e.target.value; st.limit = cfg.pageSize || 150; draw(); }
    if (t) { st.t[t] = e.target.checked; drawHead(); draw(); }
  });
  host.addEventListener('click', e => {
    const s = e.target.closest('[data-sort]');
    if (s) {
      const k = s.dataset.sort;
      if (!st.sort || st.sort.key !== k) st.sort = { key: k, dir: 1 };
      else if (st.sort.dir === 1) st.sort.dir = -1; else st.sort = null;
      drawHead(); draw(); return;
    }
    if (e.target.closest('[data-more]')) { st.limit += cfg.pageSize || 150; draw(); }
    if (e.target.closest('[data-all]')) { st.limit = 1e9; draw(); }
    if (e.target.closest('[data-reset]')) {
      st.q = ''; st.f = {}; $('input[type=search]', host).value = '';
      host.querySelectorAll('select').forEach(s => (s.value = '')); draw();
    }
  });
}

/* --------------------------------------------------------------------- views */
const state = {};
const st = id => (state[id] = state[id] || {});
const head = (title, lead) => `<h1>${esc(title)}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ''}`;
const gradeOpts = GRADES.filter(g => D.equipment.some(i => i.grade === g));
const chronOpts = CHRON.filter(c => D.equipment.some(i => i.intro === c) || D.equipSourcing.rows.some(r => r[3] === c) || D.matSourcing.rows.some(r => r[1] === c));

function startView(el) {
  const L = D.start, sections = []; let cur = null;
  L.slice(2).forEach(l => {
    if (l.b) { cur = { title: l.t, lines: [] }; sections.push(cur); } else if (cur) cur.lines.push(l);
  });
  const sec = p => sections.find(s => s.title.startsWith(p));
  const tips = (sec('TIPS') || { lines: [] }).lines.filter(l => !/filter buttons|repeat on every row/i.test(l.t));
  const swatches = s => (s ? s.lines.map(l => `<div><span class="sw" style="background:#${l.fill || 'ccc'}"></span>${esc(l.t)}</div>`).join('') : '');
  el.innerHTML = head(L[0].t, L[1].t) + `
    <div class="banner"><b>Web edition — step 1: reference tabs.</b> Everything below is read from the workbook (${esc(D.meta.version)}). The live clan Warehouse, the Requirements Check calculator and the History log will appear in the three greyed-out tabs once the shared database is connected.</div>
    <div class="cols2">
      <div class="card"><h2>How to use this site</h2>
        <ul>
          <li>Use the search box at the top to jump to any item, material, recipe scroll or part.</li>
          <li>Click any underlined name in a table to open its detail panel: ingredients, raw-material totals, where to get it and where it is used.</li>
          <li>Every table has a search box and filters, and column headers sort on click.</li>
          <li>Rate columns show the chance (%) that the monster drops or spoils the scroll or part.</li>
        </ul></div>
      <div class="card"><h2>Tabs</h2>
        <ul>
          <li><b>Material Recipes</b> — what each Tier 1–4 material is made from.</li>
          <li><b>Raw Material Breakdown</b> — each material reduced to raw materials, per unit.</li>
          <li><b>Material Recipe Sourcing</b> — where to get each material's recipe scroll.</li>
          <li><b>Equipment Recipes</b> — every weapon, armor and jewelry recipe (D to S84).</li>
          <li><b>Equipment Sourcing</b> — where to get each equipment recipe scroll and part.</li>
          <li><b>Notes</b> and <b>Audit Log</b> — methodology, open data issues and the per-row check notes.</li>
        </ul></div>
    </div>
    <div class="cols2">
      <div class="card"><h2>Scrolls &amp; currency</h2>${tips.map(l => `<p>${esc(l.t)}</p>`).join('')}</div>
      <div class="card"><h2>Chronicle labels</h2>${(sec('CHRONICLE') || { lines: [] }).lines.map(l => `<p>${esc(l.t)}</p>`).join('')}
        <h2 style="margin-top:14px">Source types</h2>${(sec('SOURCE') || { lines: [] }).lines.map(l => `<p>${esc(l.t)}</p>`).join('')}</div>
    </div>
    <div class="cols2">
      <div class="card"><h2>Colour key — materials</h2>${swatches(sections.find(s => /COLOR KEY — Materials/.test(s.title)))}</div>
      <div class="card"><h2>Colour key — equipment grade</h2>${swatches(sections.find(s => /COLOR KEY — Equipment/.test(s.title)))}</div>
    </div>`;
}

function materialsView(el) {
  el.innerHTML = head('Material Recipes', 'What each Tier 1–4 material is made from. Tier 1 uses raw materials only; higher tiers build on lower ones.') + '<div id="t"></div>';
  makeTable($('#t', el), {
    rows: D.materials, noun: 'materials', placeholder: 'Search material or ingredient…',
    search: m => m.name + ' ' + m.ing.map(i => i[0]).join(' '),
    stripe: m => tierColor(m.tier),
    filters: [
      { id: 'tier', label: 'Tier', options: ['1', '2', '3', '4'], test: (m, v) => String(m.tier) === v },
      { id: 'intro', label: 'Introduced', options: uniq(D.materials.map(m => m.intro)).sort(byOrder(CHRON)), test: (m, v) => m.intro === v },
    ],
    cols: [
      { key: 'name', label: 'Material', get: m => m.name, html: m => link(m.name) },
      { key: 'tier', label: 'Tier', get: m => m.tier, html: m => chip('Tier ' + m.tier, 't-' + m.tier) },
      { key: 'intro', label: 'Introduced', get: m => CHRON.indexOf(m.intro), html: m => `<span class="chr">${esc(m.intro)}</span>` },
      { key: 'out', label: 'Output qty', cls: 'num', get: m => m.out, html: m => num(m.out) },
      { key: 'ing', label: 'Ingredients', nosort: true, get: m => '', html: m => ingList(m.ing) },
    ],
  }, st('materials'));
}

function rawView(el) {
  const R = D.rawBreakdown, s = st('raw'); s.q = s.q || ''; if (s.hide === undefined) s.hide = false;
  el.innerHTML = head('Raw Material Breakdown', R.title) + `
    <div class="controls"><input type="search" placeholder="Search material…" value="${esc(s.q)}" aria-label="Search materials">
      <label class="tog"><input type="checkbox" id="hz"${s.hide ? ' checked' : ''}> Hide raw materials no recipe uses yet</label><span class="count"></span></div>
    <div class="tablewrap"><table class="matrix"><thead></thead><tbody></tbody></table></div>`;
  function draw() {
    const used = R.cols.map((c, i) => R.rows.some(r => r[1][i] > 0));
    const cols = R.cols.map((c, i) => i).filter(i => !s.hide || used[i]);
    $('thead', el).innerHTML = '<tr><th>Material</th>' + cols.map(i => `<th class="col">${link(R.cols[i], 'dim')}</th>`).join('') + '</tr>';
    const q = lc(s.q);
    const rows = R.rows.filter(r => !q || lc(r[0]).includes(q));
    $('tbody', el).innerHTML = rows.map(([n, v]) => `<tr><td style="--rc:${matByName[n] ? tierColor(matByName[n].tier) : 'transparent'}">${link(n)}</td>` +
      cols.map(i => `<td class="v ${v[i] ? 'nz' : 'z'}">${v[i] ? num(v[i]) : '·'}</td>`).join('') + '</tr>').join('');
    $('.count', el).textContent = `${rows.length} of ${R.rows.length} materials`;
  }
  draw();
  $('input[type=search]', el).addEventListener('input', e => { s.q = e.target.value; draw(); });
  $('#hz', el).addEventListener('change', e => { s.hide = e.target.checked; draw(); });
}

function matSourcingView(el) {
  const rows = D.matSourcing.rows;
  el.innerHTML = head('Material Recipe Sourcing', D.matSourcing.title) + '<div id="t"></div>';
  makeTable($('#t', el), {
    rows, noun: 'rows', placeholder: 'Search recipe, monster or location…',
    search: r => r.slice(0, 6).join(' '),
    group: r => r[0], groupCols: ['k'],
    stripe: r => { const m = matByName[String(r[0]).replace(/^Recipe: /, '')]; return m ? tierColor(m.tier) : ''; },
    filters: [
      { id: 'c', label: 'Chronicle', options: uniq(rows.map(r => r[1])).sort(byOrder(CHRON)), test: (r, v) => r[1] === v },
      { id: 's', label: 'Source type', options: uniq(rows.map(r => r[2])).sort(), test: (r, v) => r[2] === v },
    ],
    toggles: [{ id: 'notes', label: 'Show notes', def: false }],
    cols: [
      { key: 'k', label: 'Recipe scroll', get: r => r[0], html: r => link(r[0]) },
      { key: 'c', label: 'Chronicle', get: r => CHRON.indexOf(r[1]), html: r => `<span class="chr">${esc(r[1])}</span>` },
      { key: 's', label: 'Source', get: r => r[2], html: r => esc(r[2]) },
      { key: 'm', label: 'Monster / quest', get: r => r[3], cls: 'wrap', html: r => esc(r[3]) },
      { key: 'l', label: 'Location', get: r => r[4], cls: 'wrap', html: r => esc(r[4]) },
      { key: 'r', label: 'Rate', cls: 'num', get: r => r[5], sort: r => rateSort(r[5]), html: r => rate(r[5]) },
      { key: 'n', label: 'Notes', toggle: 'notes', nosort: true, cls: 'note', get: r => '', html: r => esc(r[6]) },
    ],
  }, st('matsrc'));
}

function equipmentView(el) {
  const items = D.equipment;
  el.innerHTML = head('Equipment Recipes', 'Every weapon, armor and jewelry recipe (D to S84). From B-grade up the recipe scroll is consumed on every craft and is not listed among the ingredients.') + '<div id="t"></div>';
  const cat = it => it.type.split(' — ')[0];
  makeTable($('#t', el), {
    rows: items, noun: 'items', pageSize: 100, placeholder: 'Search item, type or ingredient…',
    search: it => it.name + ' ' + it.type + ' ' + it.grade + ' ' + it.intro + ' ' + it.ing.map(i => i[0]).join(' '),
    stripe: it => gradeColor(it.grade),
    filters: [
      { id: 'g', label: 'Grade', options: gradeOpts, test: (it, v) => it.grade === v },
      { id: 'cat', label: 'Category', options: uniq(items.map(cat)), test: (it, v) => cat(it) === v },
      { id: 'c', label: 'Introduced', options: uniq(items.map(i => i.intro)).sort(byOrder(CHRON)), test: (it, v) => it.intro === v },
    ],
    cols: [
      { key: 'n', label: 'Item', get: it => it.name, html: it => link(it.name) },
      { key: 't', label: 'Type', get: it => it.type, cls: 'wrap hm', html: it => esc(it.type) },
      { key: 'g', label: 'Grade', get: it => GRADES.indexOf(it.grade), html: it => chip(it.grade, 'g-' + it.grade) },
      { key: 'i', label: 'Introduced', cls: 'hm', get: it => CHRON.indexOf(it.intro), html: it => `<span class="chr">${esc(it.intro)}</span>` },
      { key: 'sk', label: 'Skill lvl', cls: 'num hm', get: it => it.skill, html: it => num(it.skill) },
      { key: 'su', label: 'Success', cls: 'num hm', get: it => it.succ, html: it => pct(it.succ) },
      { key: 'mp', label: 'MP', cls: 'num hm', get: it => it.mp, html: it => num(it.mp) },
      { key: 'ing', label: 'Ingredients', nosort: true, get: () => '', html: it => ingList(it.ing) },
    ],
  }, st('equip'));
}

function equipSourcingView(el) {
  const rows = D.equipSourcing.rows;
  el.innerHTML = head('Equipment Sourcing', D.equipSourcing.title) + '<div id="t"></div>';
  makeTable($('#t', el), {
    rows, noun: 'rows', pageSize: 150, placeholder: 'Search item, monster or location…',
    search: r => r.slice(0, 7).join(' '),
    group: r => r[0], groupCols: ['k', 'g', 't'],
    stripe: r => (r[2] === 'Part' && (r[1] === 'S80' || r[1] === 'S84') ? 'var(--t-part)' : gradeColor(r[1])),
    filters: [
      { id: 'g', label: 'Grade', options: gradeOpts, test: (r, v) => r[1] === v },
      { id: 't', label: 'Type', options: ['Recipe', 'Part'], test: (r, v) => r[2] === v },
      { id: 'c', label: 'Chronicle', options: uniq(rows.map(r => r[3])).sort(byOrder(CHRON)), test: (r, v) => r[3] === v },
      { id: 's', label: 'Source type', options: uniq(rows.map(r => r[4])).sort(), test: (r, v) => r[4] === v },
    ],
    toggles: [{ id: 'notes', label: 'Show notes', def: false }],
    cols: [
      { key: 'k', label: 'Item / key material', get: r => r[0], cls: 'wrap', html: r => link(r[0]) },
      { key: 'g', label: 'Grade', get: r => GRADES.indexOf(r[1]), html: r => chip(r[1], 'g-' + r[1]) },
      { key: 't', label: 'Type', cls: 'hm', get: r => r[2], html: r => esc(r[2]) },
      { key: 'c', label: 'Chronicle', get: r => CHRON.indexOf(r[3]), html: r => `<span class="chr">${esc(r[3])}</span>` },
      { key: 's', label: 'Source', get: r => r[4], html: r => esc(r[4]) },
      { key: 'm', label: 'Monster / quest', get: r => r[5], cls: 'wrap', html: r => esc(r[5]) },
      { key: 'l', label: 'Location', get: r => r[6], cls: 'wrap', html: r => esc(r[6]) },
      { key: 'r', label: 'Rate', cls: 'num', get: r => r[7], sort: r => rateSort(r[7]), html: r => rate(r[7]) },
      { key: 'n', label: 'Notes', toggle: 'notes', nosort: true, cls: 'note', get: () => '', html: r => esc(r[8]) },
    ],
  }, st('equipsrc'));
}

function auditView(el) {
  const rows = D.audit;
  el.innerHTML = head('Audit Log', 'The original per-row check notes from each chronicle sourcing audit (the Notes column on the sourcing tabs holds only the current summary).') + '<div id="t"></div>';
  makeTable($('#t', el), {
    rows, noun: 'entries', pageSize: 150, placeholder: 'Search item, monster or note…',
    search: r => r.join(' '),
    group: r => r[0], groupCols: ['k', 'g'],
    stripe: r => gradeColor(r[1]),
    filters: [
      { id: 'g', label: 'Grade', options: gradeOpts, test: (r, v) => r[1] === v },
      { id: 'c', label: 'Chronicle', options: uniq(rows.map(r => r[2])).sort(byOrder(CHRON)), test: (r, v) => r[2] === v },
      { id: 's', label: 'Source type', options: uniq(rows.map(r => r[3])).sort(), test: (r, v) => r[3] === v },
    ],
    cols: [
      { key: 'k', label: 'Item / key material', get: r => r[0], cls: 'wrap', html: r => link(r[0]) },
      { key: 'g', label: 'Grade', get: r => GRADES.indexOf(r[1]), html: r => chip(r[1], 'g-' + r[1]) },
      { key: 'c', label: 'Chronicle', get: r => CHRON.indexOf(r[2]), html: r => `<span class="chr">${esc(r[2])}</span>` },
      { key: 's', label: 'Source', get: r => r[3], html: r => esc(r[3]) },
      { key: 'm', label: 'Monster / quest', get: r => r[4], cls: 'wrap', html: r => esc(r[4]) },
      { key: 'r', label: 'Rate', cls: 'num', get: r => r[5], html: r => esc(r[5]) },
      { key: 'n', label: 'Original check note', nosort: true, cls: 'note', get: () => '', html: r => esc(r[6]) },
    ],
  }, st('audit'));
}

function notesView(el) {
  const L = D.notes, isHead = (l, i) => {
    if (!l.t) return false;
    if (l.b) return true;
    const first = l.t.trim().split(/\s+/)[0];
    const prevBlank = i === 0 || !L[i - 1].t;
    return (prevBlank || /^(COLOR|SHEETS|GENERAL)$/.test(first)) && l.t.length <= 110 && /^[A-Z0-9][A-Z0-9\-]+$/.test(first) && first.length >= 2 && !/[.:]$/.test(first);
  };
  let html = '', buf = [];
  const flush = () => { if (buf.length) { html += `<div class="pre">${esc(buf.join('\n').replace(/^\n+|\n+$/g, ''))}</div>`; buf = []; } };
  L.slice(1).forEach((l, j) => {
    const i = j + 1;
    if (isHead(l, i)) { flush(); html += `<h3>${esc(l.t.trim())}</h3>`; } else buf.push(l.t);
  });
  flush();
  el.innerHTML = head(L[0].t.replace(/^Notes — /, 'Notes — ').trim(), '') + `<div class="card notes">${html}</div>`;
}

function soonView(title, lead, points) {
  return el => {
    el.innerHTML = head(title, lead) + `<div class="card"><p><b>Not connected yet.</b> This tab is part of the live, shared part of the site.</p><ul>${points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
  };
}

const VIEWS = [
  { id: 'start', label: 'Start Here', group: 'Reference', render: startView },
  { id: 'materials', label: 'Material Recipes', group: 'Reference', render: materialsView },
  { id: 'raw', label: 'Raw Material Breakdown', group: 'Reference', render: rawView },
  { id: 'matsrc', label: 'Material Recipe Sourcing', group: 'Reference', render: matSourcingView },
  { id: 'equip', label: 'Equipment Recipes', group: 'Reference', render: equipmentView },
  { id: 'equipsrc', label: 'Equipment Sourcing', group: 'Reference', render: equipSourcingView },
  { id: 'notes', label: 'Notes', group: 'Reference', render: notesView },
  { id: 'audit', label: 'Audit Log', group: 'Reference', render: auditView },
  { id: 'warehouse', label: 'Warehouse', group: 'Clan (live)', soon: true, render: soonView('Warehouse', 'The shared clan stock.', ['Current quantity of every material, recipe scroll, part and crystal, filtered by category and grade.', 'Add and Remove buttons for deposits and withdrawals — both of you see the same numbers.']) },
  { id: 'reqcheck', label: 'Requirements Check', group: 'Clan (live)', soon: true, render: soonView('Requirements Check', 'The crafting calculator.', ['Pick a grade, an item and a quantity: see Needed vs Warehouse vs Balance.', 'Missing ingredients are broken down into the sub-materials you still need.', 'Commit (enabled when every balance is green) subtracts the materials from the shared warehouse in one step.']) },
  { id: 'history', label: 'History', group: 'Clan (live)', soon: true, render: soonView('History', 'Who changed what, and when.', ['Every deposit, withdrawal and commit with the person and the time.']) },
];
const viewById = Object.fromEntries(VIEWS.map(v => [v.id, v]));

/* ------------------------------------------------------------------- drawer */
function sourcesHtml(rows, kind) {
  if (!rows || !rows.length) return '<p class="lead">No sourcing rows in the workbook.</p>';
  return rows.map(r => {
    const [chr, type, mon, loc, rt, note] = kind === 'eq' ? [r[3], r[4], r[5], r[6], r[7], r[8]] : [r[1], r[2], r[3], r[4], r[5], r[6]];
    return `<div class="src"><span class="rate">${rate(rt)}</span><span class="chr">${esc(chr)}</span> <b>${esc(type)}</b> · ${esc(mon)}<br><span style="color:var(--muted)">${esc(loc)}</span>${note ? `<div class="note">${esc(note)}</div>` : ''}</div>`;
  }).join('');
}
function pills(list) { return `<div class="pills">${list.map(n => link(n)).join('')}</div>`; }
function usedBlock(name) {
  const m = usedInMats[name] || [], it = usedInItems[name] || [];
  let h = '';
  if (m.length) h += `<h4>Used in materials (${m.length})</h4>${pills(m.map(x => x.name))}`;
  if (it.length) h += `<h4>Used in equipment (${it.length})</h4>${pills(it.slice(0, 60).map(x => x.name))}${it.length > 60 ? `<p class="lead">…and ${it.length - 60} more — search the Equipment Recipes tab for “${esc(name)}”.</p>` : ''}`;
  return h;
}
function detail(name) {
  const k = kindOf(name), it = itemByName[name], mat = matByName[name];
  let h = `<h2>${esc(name)}</h2><div class="meta">${chip(k.label, k.cls)}`;
  let body = '';
  if (it) {
    h += ` <span class="chr">${esc(it.intro)}</span></div><div class="meta">${esc(it.type)}</div><div class="meta">Skill lvl ${num(it.skill)} · Success ${pct(it.succ)} · MP ${num(it.mp)}</div>`;
    body += `<h4>Ingredients</h4>${it.ing.map(([n, q]) => `<div class="rowline"><span class="q">${num(q)}×</span>${link(n, isCurrency(n) ? 'dim' : '')}<span class="k">${chip(kindOf(n).label, kindOf(n).cls)}</span></div>`).join('')}`;
    body += `<h4>Recipe scroll — where to get it</h4>${sourcesHtml(it.rk ? esByKey[it.rk] : null, 'eq')}`;
  } else if (mat) {
    h += ` <span class="chr">${esc(mat.intro)}</span></div><div class="meta">Makes ${num(mat.out)} per craft</div>`;
    body += `<h4>Ingredients</h4>${mat.ing.map(([n, q]) => `<div class="rowline"><span class="q">${num(q)}×</span>${link(n)}<span class="k">${chip(kindOf(n).label, kindOf(n).cls)}</span></div>`).join('')}`;
    const rv = rawByMat[name];
    if (rv) {
      const parts = rawCols.map((c, i) => [c, rv[i]]).filter(x => x[1] > 0);
      body += `<h4>Raw materials per 1 unit</h4>${parts.map(([c, q]) => `<div class="rowline"><span class="q">${num(q)}×</span>${link(c)}</div>`).join('')}`;
    }
    body += `<h4>Recipe scroll — where to get it</h4>${sourcesHtml(msByKey['Recipe: ' + name], 'ms')}`;
  } else {
    h += '</div>';
    const eRows = esByKey[name], mRows = msByKey[name];
    if (eRows) body += `<h4>Where to get it</h4>${sourcesHtml(eRows, 'eq')}`;
    if (mRows) body += `<h4>Where to get it</h4>${sourcesHtml(mRows, 'ms')}`;
    const target = recipeOf[name];
    if (target) body += `<h4>Teaches</h4>${pills([target.name])}`;
    if (rawCols.includes(name)) {
      const need = D.rawBreakdown.rows.filter(r => r[1][rawCols.indexOf(name)] > 0);
      if (need.length) body += `<h4>Needed (per unit) by</h4>${pills(need.map(r => r[0]))}`;
      else body += '<p class="lead">No recipe in the workbook uses this raw material yet.</p>';
    }
    if (isCurrency(name)) body += '<p class="lead">Crystals and Gemstones are common currency and are not tracked by source.</p>';
    if (!eRows && !mRows && !rawCols.includes(name) && !isCurrency(name) && !target) body += '<p class="lead">No further data in the workbook for this name.</p>';
  }
  body += usedBlock(name);
  return `<button class="iconbtn x" data-close aria-label="Close">Close ✕</button>${h}${body}`;
}

/* ------------------------------------------------------------------ routing */
let current = null, openName = null;
function parseHash() {
  const m = location.hash.replace(/^#\/?/, '').split('/');
  return { view: viewById[m[0]] ? m[0] : 'start', name: m[1] ? decodeURIComponent(m.slice(1).join('/')) : null };
}
function go(view, name) { location.hash = '#/' + view + (name ? '/' + encodeURIComponent(name) : ''); }
function route() {
  const { view, name } = parseHash();
  if (view !== current) {
    current = view;
    const el = $('#view'); el.innerHTML = '';
    viewById[view].render(el);
    document.title = viewById[view].label + ' · L2 Reborn Recipe Tracker';
    renderNav(); $('#side').classList.remove('open'); window.scrollTo(0, 0);
  }
  if (name !== openName) { openName = name; name ? showDrawer(name) : hideDrawer(); }
}
function showDrawer(name) {
  const d = $('#drawer'); d.innerHTML = detail(name); d.classList.add('show'); d.setAttribute('aria-hidden', 'false'); d.scrollTop = 0;
  $('#scrim').classList.add('show');
}
function hideDrawer() { $('#drawer').classList.remove('show'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('show'); }
function closeDrawer() { if (openName) go(current); }
function renderNav() {
  let h = '', g = '';
  VIEWS.forEach(v => {
    if (v.group !== g) { g = v.group; h += `<div class="navgroup">${esc(g)}</div>`; }
    h += `<a href="#/${v.id}" class="${v.id === current ? 'on' : ''}${v.soon ? ' later' : ''}">${esc(v.label)}${v.soon ? '<span class="soon">soon</span>' : ''}</a>`;
  });
  $('#nav').innerHTML = `<div class="nav">${h}</div>`;
}

/* --------------------------------------------------------------- global search */
const names = new Map();
function addName(n, rank) { if (n && !names.has(n)) names.set(n, rank); }
D.equipment.forEach(i => addName(i.name, 0)); D.materials.forEach(m => addName(m.name, 1));
rawCols.forEach(n => addName(n, 2));
D.equipSourcing.rows.forEach(r => addName(r[0], 3)); D.matSourcing.rows.forEach(r => addName(r[0], 3));
D.catalogue.forEach(c => addName(c[1], 4));
const nameList = [...names.entries()].map(([n, r]) => ({ n, l: lc(n), r }));
let resIdx = -1, resList = [];
function searchNames(q) {
  q = lc(q.trim()); if (q.length < 2) return [];
  const terms = q.split(/\s+/);
  return nameList.filter(x => terms.every(t => x.l.includes(t)))
    .sort((a, b) => (b.l.startsWith(q) - a.l.startsWith(q)) || a.r - b.r || a.n.localeCompare(b.n)).slice(0, 14);
}
function drawResults() {
  const box = $('#gres'), q = $('#gs').value;
  resList = searchNames(q); resIdx = resList.length ? 0 : -1;
  if (q.trim().length < 2) { box.classList.remove('show'); return; }
  box.innerHTML = resList.length ? resList.map((x, i) => `<button data-open="${esc(x.n)}" class="${i === 0 ? 'cur' : ''}"><span>${esc(x.n)}</span><span class="kind">${esc(kindOf(x.n).label)}</span></button>`).join('') : '<div class="none">No match.</div>';
  box.classList.add('show');
}

/* --------------------------------------------------------------------- setup */
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) {
    $('#gres').classList.remove('show');
    go(current || 'start', o.dataset.open); return;
  }
  if (e.target.closest('[data-close]') || e.target.id === 'scrim') closeDrawer();
  if (!e.target.closest('.gsearch')) $('#gres').classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#gres').classList.remove('show'); closeDrawer(); }
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#gs').focus(); }
});
const gs = $('#gs');
gs.addEventListener('input', drawResults);
gs.addEventListener('focus', () => gs.value.trim().length >= 2 && drawResults());
gs.addEventListener('keydown', e => {
  const btns = [...document.querySelectorAll('#gres button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!btns.length) return;
    resIdx = (resIdx + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle('cur', i === resIdx)); btns[resIdx].scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && resList[resIdx]) { $('#gres').classList.remove('show'); gs.blur(); go(current || 'start', resList[resIdx].n); }
});
$('#burger').addEventListener('click', () => $('#side').classList.toggle('open'));
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('l2theme', t); } catch (e) { /* ignore */ } }
let saved = null; try { saved = localStorage.getItem('l2theme'); } catch (e) { /* ignore */ }
setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
$('#foot').innerHTML = `Data from workbook <b>${esc(D.meta.version)}</b><br>${esc(D.meta.date)} · exported ${esc(D.meta.exported)}`;
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
