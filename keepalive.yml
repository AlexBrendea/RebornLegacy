# Keeps the free Supabase project from being paused after a quiet week.
# Put this file in your GitHub repo at:  .github/workflows/keepalive.yml
name: Keep database awake
on:
  schedule:
    - cron: '17 6 * * 1,4'     # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch: {}          # also lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database a trivial question
        run: |
          curl -fsS -X POST "https://kwiretswdwziuzstsuyh.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_TGWG3cu1q-xVQe4x_rhAZQ_TT-4vD6r" \
            -H "Content-Type: application/json" -d '{}'
